<!doctype html>
<html><head><meta charset="utf-8"><title>Handmade Quilts - Your account</title></head>
<body>
  <h1>Your account</h1>
  <form action="http://handmade-quilts.com/login" method="post">
    <input name="email" type="email" placeholder="Email">
    <input id="pw" name="password" type="password" placeholder="Password">
    <button type="button" id="show" onclick="document.getElementById('pw').type = 'text'">Show password</button>
    <button>Sign in</button>
  </form>
</body></html>
